name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Theos and ldid
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        brew install ldid

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        make

    - name: Find and Copy Dylib
      run: |
        # Tìm file dylib và copy ra thư mục ngoài cùng
        find . -name "*.dylib" -exec cp {} ./MyMenu.dylib \;

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyMenu-Dylib
        path: MyMenu.dylib
